spring.application.name=FACULTY-SERVICE
server.port=8085
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.datasource.url=${FACULTY_DATABASE_URL:jdbc:postgresql://localhost:5432/facultydb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${FACULTY_DATABASE_USERNAME:postgres}
spring.datasource.password=${FACULTY_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://${EUREKA_HOSTPORT:localhost:8761}/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME:localhost}}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka + Spring Cloud LoadBalancer
spring.cloud.loadbalancer.enabled=true

# Shared JWT secret
jwt.secret=${JWT_SECRET:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
