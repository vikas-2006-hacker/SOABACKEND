spring.application.name=STUDENT-SERVICE
server.port=8082
server.address=${SERVER_ADDRESS:0.0.0.0}

# Database Configuration (PostgreSQL)
spring.datasource.url=${STUDENT_DATABASE_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${STUDENT_DATABASE_USERNAME:postgres}
spring.datasource.password=${STUDENT_DATABASE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://${EUREKA_HOSTPORT:localhost:8761}/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME:localhost}}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
