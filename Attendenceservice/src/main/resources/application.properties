spring.application.name=ATTENDANCE-SERVICE
server.port=8083
server.address=${SERVER_ADDRESS:0.0.0.0}

# Database Configuration (PostgreSQL)
spring.datasource.url=${ATTENDANCE_DATABASE_URL:jdbc:postgresql://localhost:5432/Attendencedb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${ATTENDANCE_DATABASE_USERNAME:postgres}
spring.datasource.password=${ATTENDANCE_DATABASE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Central thresholds used for attendance status, risk, and exam eligibility.
attendance.excellent-threshold=${ATTENDANCE_EXCELLENT_THRESHOLD:90}
attendance.good-threshold=${ATTENDANCE_GOOD_THRESHOLD:80}
attendance.warning-threshold=${ATTENDANCE_WARNING_THRESHOLD:75}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_URL:http://${EUREKA_HOSTPORT:localhost:8761}/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:${RENDER_EXTERNAL_HOSTNAME:localhost}}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Eureka + Spring Cloud LoadBalancer
spring.cloud.loadbalancer.enabled=true

# Shared JWT secret
jwt.secret=${JWT_SECRET:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
